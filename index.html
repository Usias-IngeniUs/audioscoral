<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbefeb">
  <title>Coral · Un mensaje para ti</title>
  <style>
    *{box-sizing:border-box}
    :root{--rose:#d98486;--rose-light:#fce9e5;--dark:#3b3030;--muted:#978785;--line:#eadcda}
    html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}
    body{
      min-height:100svh;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--dark);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(circle at 0 25%,rgba(226,146,143,.18) 0 72px,transparent 74px),
        radial-gradient(circle at 100% 100%,rgba(226,146,143,.14) 0 62px,transparent 64px),
        linear-gradient(135deg,#f9dfd8 0%,#fbf4f0 55%,#fffaf8 100%);
    }
    .card{
      width:100%;
      max-width:560px;
      margin:auto;
      padding:42px 38px 28px;
      border-radius:36px;
      background:rgba(255,255,255,.92);
      box-shadow:0 24px 70px rgba(92,55,55,.13);
      text-align:center;
    }
    .music{
      width:72px;height:72px;margin:0 auto 22px;
      display:grid;place-items:center;border-radius:24px;
      font-size:32px;background:linear-gradient(145deg,#fff,#fce9e5);
      box-shadow:0 12px 30px rgba(184,111,111,.12)
    }
    .eyebrow{margin:0 0 12px;color:var(--rose);font-size:12px;font-weight:800;letter-spacing:.26em;text-transform:uppercase}
    h1{margin:0 0 18px;font:400 clamp(40px,6vw,56px)/1.02 Georgia,"Times New Roman",serif}
    .intro{margin:0 auto 26px;max-width:420px;color:var(--muted);font-size:15px;line-height:1.65}
    .hint{margin-bottom:20px;color:#aa9996;font-size:11px;letter-spacing:.09em;text-transform:uppercase}

    /* REPRODUCTOR PERSONALIZADO CORAL */
    .custom-player{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      margin:20px 0;
    }
    .play-btn{
      width:84px;
      height:84px;
      border:none;
      border-radius:50%;
      background:linear-gradient(135deg, #e5989a, #c86f73);
      color:white;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(200, 111, 115, 0.35);
      transition:transform 0.2s ease, box-shadow 0.2s ease;
      outline:none;
    }
    .play-btn:active{
      transform:scale(0.95);
    }
    .play-btn svg{
      width:32px;
      height:32px;
      fill:currentColor;
      margin-left:4px;
    }
    .play-btn.playing svg{
      margin-left:0;
    }
    .progress-container{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .time-text{
      font-size:12px;
      color:var(--muted);
      min-width:35px;
    }
    .progress-bar{
      flex:1;
      -webkit-appearance:none;
      appearance:none;
      height:6px;
      border-radius:3px;
      background:var(--line);
      outline:none;
      cursor:pointer;
    }
    .progress-bar::-webkit-slider-thumb{
      -webkit-appearance:none;
      width:16px;
      height:16px;
      border-radius:50%;
      background:var(--rose);
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
      cursor:pointer;
    }

    .message{padding:20px;color:var(--muted);font-size:14px}
    .hidden{display:none!important}
    .caption{margin:16px 0 26px;color:#ad9490;font-size:11px}
    footer{padding-top:21px;border-top:1px solid var(--line)}
    .brand{color:#8f7775;font-size:12px;font-weight:800;letter-spacing:.22em}.brand b{color:#c86f73}
    .tag{margin-top:8px;color:#b39b97;font:italic 13px Georgia,"Times New Roman",serif}

    @media(max-width:600px){
      body{align-items:flex-start;padding:12px 10px}
      .card{max-width:100%;padding:30px 18px 23px;border-radius:28px}
      .music{width:62px;height:62px;border-radius:21px;font-size:28px;margin-bottom:18px}
      h1{font-size:clamp(38px,12vw,50px)}
      .intro{font-size:14px;line-height:1.55;margin-bottom:22px}
    }
    @media(max-width:380px){
      body{padding:8px}
      .card{padding:25px 13px 20px;border-radius:24px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="music" aria-hidden="true">♫</div>
    <p class="eyebrow">Un detalle especial</p>
    <h1>Un mensaje<br>para ti</h1>
    <p class="intro">Hay momentos que no caben en una fotografía.<br>Algunos merecen ser escuchados.</p>

    <div id="message" class="message">Preparando tu recuerdo...</div>

    <div id="playerWrap" class="custom-player hidden">
      <audio id="audioElement" preload="metadata"></audio>

      <button id="playBtn" class="play-btn" aria-label="Reproducir">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="hint" id="statusHint">Toca ▶ para escuchar</div>

      <div class="progress-container">
        <span id="currentTime" class="time-text">0:00</span>
        <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
        <span id="durationTime" class="time-text">0:00</span>
      </div>
    </div>

    <p class="caption">Un recuerdo preparado especialmente para ti.</p>

    <footer>
      <div class="brand"><b>CORAL</b> · RECUERDOS</div>
      <div class="tag">Hecho para volver a sentirlo.</div>
    </footer>
  </main>

  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const id = (params.get("id") || "").trim();

      const message = document.getElementById("message");
      const playerWrap = document.getElementById("playerWrap");
      const audio = document.getElementById("audioElement");
      const playBtn = document.getElementById("playBtn");
      const playIcon = document.getElementById("playIcon");
      const statusHint = document.getElementById("statusHint");
      const progressBar = document.getElementById("progressBar");
      const currentTimeEl = document.getElementById("currentTime");
      const durationTimeEl = document.getElementById("durationTime");

      const playSVG = '<path d="M8 5v14l11-7z"/>';
      const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

      if (!id) {
        message.textContent = "Audio no especificado.";
        return;
      }

      // RUTA LOCAL EN GITHUB: Busca dentro de la carpeta 'audios' el archivo .mp3
      audio.src = "./audios/" + encodeURIComponent(id) + ".mp3";

      message.classList.add("hidden");
      playerWrap.classList.remove("hidden");

      function formatTime(secs) {
        if (isNaN(secs)) return "0:00";
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      audio.addEventListener("loadedmetadata", () => {
        durationTimeEl.textContent = formatTime(audio.duration);
      });

      playBtn.addEventListener("click", () => {
        if (audio.paused) {
          audio.play().then(() => {
            playIcon.innerHTML = pauseSVG;
            playBtn.classList.add("playing");
            statusHint.textContent = "Reproduciendo";
          }).catch(err => {
            console.error("Error reproduciendo audio:", err);
            statusHint.textContent = "No se pudo cargar el archivo";
          });
        } else {
          audio.pause();
          playIcon.innerHTML = playSVG;
          playBtn.classList.remove("playing");
          statusHint.textContent = "Pausado";
        }
      });

      audio.addEventListener("timeupdate", () => {
        if (!isNaN(audio.duration)) {
          const progress = (audio.currentTime / audio.duration) * 100;
          progressBar.value = progress;
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      });

      progressBar.addEventListener("input", () => {
        if (!isNaN(audio.duration)) {
          audio.currentTime = (progressBar.value / 100) * audio.duration;
        }
      });

      audio.addEventListener("ended", () => {
        playIcon.innerHTML = playSVG;
        playBtn.classList.remove("playing");
        statusHint.textContent = "Toca ▶ para escuchar de nuevo";
        progressBar.value = 0;
        currentTimeEl.textContent = "0:00";
      });
    })();
  </script>
</body>
</html>
